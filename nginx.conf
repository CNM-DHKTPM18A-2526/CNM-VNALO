server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # 1. Health Check
    location /health { return 200 'OK'; add_header Content-Type text/plain; }

    # 2. WebSocket (Realtime Connection)
    location /socket.io/ {
        proxy_pass http://message-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Timeout settings for long-lived socket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_cache off;
    }

    # 3. Media Service (Java - Port 8083)
    location /api/v1/media {
        proxy_pass http://media-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. AI Service (Java - Port 8094)
    location /api/v1/ai {
        proxy_pass http://ai-service:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Message Service (Node.js - Port 3000)
    location ~ ^/api/v1/(conversations|messages|presence|inbox) {
        proxy_pass http://message-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. Core Service - Catch All (Java - Port 8080)
    location /api/v1/ {
        proxy_pass http://core-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
