server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # 1. Health Check
    location /health { return 200 'OK'; add_header Content-Type text/plain; }

    # Resolver for Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    # 2. WebSocket (Realtime Connection)
    location /socket.io/ {
        proxy_pass http://realtime-gateway:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # IMPORTANT: Disable buffering to eliminate 1s latency
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        
        # Timeout settings for long-lived socket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Media Service (Java - Port 8083)
    # This service has context-path: /api/v1/media
    location /api/v1/media {
        proxy_pass http://media-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Alias /api/v1/upload → media-service /api/v1/media/upload
    location /api/v1/upload {
        proxy_pass http://media-service:8083/api/v1/media/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Alias /api/v1/files → media-service /api/v1/media/public
    location /api/v1/files {
        proxy_pass http://media-service:8083/api/v1/media/public;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. AI Service (Java - Port 8094)
    location /api/v1/ai {
        proxy_pass http://ai-service:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 5. Message Service (Node.js - Port 3000)
    # Priority: High (Regex)
    location ~ ^/api/v1/(conversations|messages|stickers|presence|inbox|groups) {
        proxy_pass http://message-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. Notification Service (Java - Port 8087)
    location /api/v1/notifications {
        proxy_pass http://notification-service:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Content Service (Java - Port 8086)
    location ~ ^/api/v1/(posts|stories|feeds|comments) {
        proxy_pass http://content-service:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 8. Analytics Service (Java - Port 8084)
    location /api/v1/analytics {
        proxy_pass http://analytics-service:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 9. Core Service - Catch All (Java - Port 8081)
    # This handles: auth, users, profile, contacts, settings, etc.
    location /api/v1/ {
        proxy_pass http://core-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 10. Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
