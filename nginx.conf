server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # 1. Health Check
    location /health { return 200 'OK'; add_header Content-Type text/plain; }

    # Resolver for Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    # 2. WebSocket (Realtime Connection)
    location /socket.io/ {
        set $realtime_upstream http://realtime-gateway:8085;
        proxy_pass $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # IMPORTANT: Disable buffering to eliminate 1s latency
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        
        # Timeout settings for long-lived socket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Media Service (Java - Port 8083)
    location ~ ^/api/v1/(media|upload|files)(.*)$ {
        set $media_upstream http://media-service:8083/$1$2;
        proxy_pass $media_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. AI Service (Java - Port 8094)
    location /api/v1/ai {
        set $ai_upstream http://ai-service:8094;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 5. Message Service (Node.js - Port 3000)
    # Priority: High (Regex)
    location ~ ^/api/v1/(conversations|messages|stickers|presence|inbox|groups) {
        set $message_upstream http://message-service:3000;
        proxy_pass $message_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. Notification Service (Java - Port 8087)
    location /api/v1/notifications {
        set $notification_upstream http://notification-service:8087;
        proxy_pass $notification_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Content Service (Java - Port 8086)
    location ~ ^/api/v1/(posts|stories|feeds|comments) {
        set $content_upstream http://content-service:8086;
        proxy_pass $content_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 8. Analytics Service (Java - Port 8084)
    location /api/v1/analytics {
        set $analytics_upstream http://analytics-service:8084;
        proxy_pass $analytics_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 9. Core Service - Catch All (Java - Port 8081)
    # This handles: auth, users, profile, contacts, settings, etc.
    location /api/v1/ {
        set $core_upstream http://core-service:8081;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 10. Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
