  ai-service:
    build:
      context: ../backend/java-services/services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      SERVER_PORT: 8094
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-5}
      AI_RATE_LIMIT_GLOBAL: ${AI_RATE_LIMIT_GLOBAL:-10}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xss256k"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vnalo-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8094 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  content-service:
    build:
      context: ../backend/java-services/services/content-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${CONTENT_DB_NAME:-vnalo_content}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xss256k"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vnalo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/api/v1/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
  notification-service:
    build:
      context: ../backend/java-services/services/notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vnalo_notification
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-vnalo}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_FAIL_FAST: ${FIREBASE_FAIL_FAST:-false}
      FIREBASE_CREDENTIALS_PATH: file:///app/firebase-credentials/firebase-adminsdk.json
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xss256k"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - firebase_credentials:/app/firebase-credentials:ro
    networks:
      - vnalo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/api/v1/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  frontend-web:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - core-service
      - message-service
      - media-service
      - content-service
      - realtime-gateway
    networks:
      - vnalo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  rabbitmq_data:
    driver: local
  media_local_data:
    driver: local
  firebase_credentials:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FIREBASE_CREDENTIALS_DIR:-./firebase-credentials}

networks:
  vnalo-network:
    driver: bridge
