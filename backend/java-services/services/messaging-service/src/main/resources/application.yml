spring:
  application:
    name: messaging-service
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vnalo_messaging}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:sapassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:vnalo_messaging}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: CREATE_IF_NOT_EXISTS

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: messaging-service

server:
  port: 8082
  servlet:
    context-path: /api/v1

# JWT Configuration - shared with core-service
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:vnalo}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}

logging:
  level:
    iuh.cnm.vnalo: ${LOG_LEVEL:INFO}
    org.springframework.security.config.annotation.authentication.configuration: ERROR

# Firebase Cloud Messaging
firebase:
  config-path: ${FIREBASE_CONFIG_PATH:}

# WebRTC ICE Servers (returned to clients for peer connection setup)
webrtc:
  ice-servers:
    - url: stun:stun.l.google.com:19302
    - url: stun:stun1.l.google.com:19302

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# =============================================================================
# DEV PROFILE
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

jwt:
  secret: ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi10aGlzLWlzLWF0LWxlYXN0LTUxMi1iaXRzLWxvbmc=

logging:
  level:
    iuh.cnm.vnalo: DEBUG

---
# =============================================================================
# PROD PROFILE
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    iuh.cnm.vnalo: INFO
    org.springframework.security: WARN
