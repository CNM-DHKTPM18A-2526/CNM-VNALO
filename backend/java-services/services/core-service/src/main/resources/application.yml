spring:
  application:
    name: core-service
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vnalo_core}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: core-service

server:
  port: 8081
  servlet:
    context-path: /api/v1

# JWT Configuration
# REQUIRED: Set JWT_SECRET environment variable!
# Generate: openssl rand -base64 64 OR run scripts/generate-jwt-secret.ps1
# For development, use .env file in project root
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:vnalo}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}   # 24 hours
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

logging:
  level:
    iuh.cnm.vnalo: ${LOG_LEVEL:INFO}
    org.springframework.security.config.annotation.authentication.configuration: ERROR

# Firebase Configuration - Set FIREBASE_CREDENTIALS_PATH in production
firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:iuh-cnm-vnalo-firebase-adminsdk-fbsvc-5008b7c5eb.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# OTP Configuration
otp:
  enabled: ${OTP_ENABLED:true}                    # Set to false to skip OTP verification
  expiration-minutes: ${OTP_EXPIRATION:5}         # OTP validity duration
  max-attempts: ${OTP_MAX_ATTEMPTS:3}             # Max wrong attempts before invalidation
  length: 6                                       # OTP code length
  rate-limit:
    requests-per-hour: 5                          # Max OTP requests per phone per hour
    cooldown-seconds: 60                          # Min wait time between requests
  test-mode:
    enabled: ${OTP_TEST_MODE:false}               # Use mock OTP for testing
    mock-otp: "123456"                            # Always-accepted OTP in test mode
    log-otp: true                                 # Log OTP to console in test mode

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Dev profile: OTP disabled for faster development
otp:
  enabled: false

logging:
  level:
    iuh.cnm.vnalo: DEBUG

---
# Local profile: Use H2 in-memory database (no Docker required)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:vnalo_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  h2:
    console:
      enabled: true
      path: /h2-console

otp:
  enabled: false

logging:
  level:
    iuh.cnm.vnalo: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

---
# Production profile: Hardened security settings
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

# Production: Disable Swagger UI
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production: Hide health details
management:
  endpoint:
    health:
      show-details: never

# Production: OTP enabled, test mode disabled
otp:
  enabled: true
  test-mode:
    enabled: false
    log-otp: false

logging:
  level:
    iuh.cnm.vnalo: INFO
    org.springframework.security: WARN

