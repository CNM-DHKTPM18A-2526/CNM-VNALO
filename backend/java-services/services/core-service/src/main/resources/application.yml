spring:
  application:
    name: core-service
  profiles:
    active: dev  # Default to dev profile (requires Docker)

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vnalo_core}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: core-service

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

server:
  port: 8081
  servlet:
    context-path: /api/v1

# JWT Configuration - REQUIRED for all profiles
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:vnalo}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}   # 24 hours
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

logging:
  level:
    iuh.cnm.vnalo: ${LOG_LEVEL:INFO}
    org.springframework.security.config.annotation.authentication.configuration: ERROR

# Firebase Configuration
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  fail-fast: ${FIREBASE_FAIL_FAST:false}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# OTP Configuration
otp:
  enabled: ${OTP_ENABLED:true}
  email-enabled: ${OTP_EMAIL_ENABLED:true}
  expiration-minutes: ${OTP_EXPIRATION:5}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}
  length: 6
  rate-limit:
    requests-per-hour: 5
    cooldown-seconds: 60
  test-mode:
    enabled: ${OTP_TEST_MODE:false}
    mock-otp: "123456"
    log-otp: true

---
# =============================================================================
# DEV PROFILE - Development with Docker (PostgreSQL + Redis required)
# =============================================================================
# Usage: docker-compose up -d && mvnw spring-boot:run
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Dev: Testing mode overrides
# Dev: OTP email delivery defaults (set SMTP_USER + MAIL_APP_PASSWORD in docker/.env)
otp:
  enabled: ${OTP_ENABLED:true}
  email-enabled: ${OTP_EMAIL_ENABLED:true}
  test-mode:
    enabled: ${OTP_TEST_MODE:false}     # Can be disabled to test real email sending
    mock-otp: "123456"
    log-otp: ${OTP_LOG_OTP:false}

# jwt:
#   secret: ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi10aGlzLWlzLWF0LWxlYXN0LTUxMi1iaXRzLWxvbmc=

logging:
  level:
    iuh.cnm.vnalo: DEBUG

app:
  sync-policy:
    enforce-web-restriction: false

---
# =============================================================================
# PROD PROFILE - Production deployment with hardened security
# =============================================================================
# Usage: Set all environment variables and run with -Dspring.profiles.active=prod
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Production: Disable Swagger UI
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production: Hide health details
management:
  endpoint:
    health:
      show-details: never

# Production: OTP enabled, test mode disabled
otp:
  enabled: true
  test-mode:
    enabled: false
    log-otp: false

logging:
  level:
    iuh.cnm.vnalo: INFO
    org.springframework.security: WARN

firebase:
  enabled: true
  fail-fast: true
