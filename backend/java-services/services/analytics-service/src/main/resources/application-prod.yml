spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    table: flyway_schema_history_analytics

analytics:
  internal:
    api-key: ${ANALYTICS_INTERNAL_API_KEY}
    client-name: ${ANALYTICS_INTERNAL_CLIENT_NAME:analytics-internal-service}
  cache:
    enabled: ${ANALYTICS_CACHE_ENABLED:true}
    overview-ttl: ${ANALYTICS_CACHE_OVERVIEW_TTL:PT2M}
    dashboard-ttl: ${ANALYTICS_CACHE_DASHBOARD_TTL:PT1M}
    maximum-size: ${ANALYTICS_CACHE_MAX_SIZE:20000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: analytics-service
