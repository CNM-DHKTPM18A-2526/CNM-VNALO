server:
  port: 8086
  servlet:
    context-path: /api/v1

spring:
  application:
    name: content-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vnalo_core}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # friendship nằm ở schema public; story ở content
      connection-init-sql: SET search_path TO content, public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: content
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: content
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT — must match core-service (same secret as đăng nhập web/server)
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:vnalo}

# Khi chạy content local nhưng user đăng nhập vnalo.fit → lấy danh sách bạn từ core
app:
  core-service:
    base-url: ${CORE_SERVICE_URL:}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: always