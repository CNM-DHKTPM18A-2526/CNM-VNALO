spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vnalo_core
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    table: flyway_schema_history_moderation
    baseline-on-migrate: true
    baseline-version: 0

  main:
    allow-bean-definition-overriding: true

jwt:
  secret: dGVzdG1vZGVyYXRpb25zZWNyZXRrZXl0ZXN0MTIzNDU2Nzg5MDEyMzQ1Ng==

logging:
  level:
    org.flywaydb: INFO
    org.springframework.test: INFO
