org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:MaxDirectMemorySize=2G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
org.gradle.caching=false
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process

# If your build still fails due to JDK version mismatch after setting JAVA_HOME, 
# uncomment the line below and point it to your JDK installation (e.g. C:/Program Files/Java/jdk-25)
# org.gradle.java.home=C:/Program Files/Java/jdk-25

org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.paths=C:/Program Files/Java
