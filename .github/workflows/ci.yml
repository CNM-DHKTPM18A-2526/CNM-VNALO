name: CI

on:
  push:
    branches:
      - main
      - nguyenvu
      - ai-mobile-assistant
  pull_request:

jobs:
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

  core-service-test:
    name: Core Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java-services/services/core-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run core-service tests
        run: ./mvnw -B test

  ai-service-test:
    name: AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java-services/services/ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run ai-service tests
        run: ./mvnw -B test
